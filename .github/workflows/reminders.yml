name: Send reminders

on:
  schedule:
    # GitHub can leave hours between scheduled runs, so each run keeps checking every 15 minutes for
    # almost six hours, and these starts keep the next run queued to take over when it ends.
    - cron: "7,37 * * * *"
  # Each run starts the next one as it finishes, so the checks carry on without a gap. The schedule
  # above only restarts the chain if it ever breaks.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be sent"
        type: boolean
        default: false

# One at a time. A run started meanwhile waits its turn instead of cancelling the one checking now.
concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/send-reminders.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Optional: lets the sender see reading and reviews done since the app was last opened.
          CONNECTIONS_UID: ${{ secrets.CONNECTIONS_UID }}
          LIBRARY_EMAIL: ${{ secrets.LIBRARY_EMAIL }}
          LIBRARY_PASSWORD: ${{ secrets.LIBRARY_PASSWORD }}
          LIBRARY_SUPABASE_URL: ${{ secrets.LIBRARY_SUPABASE_URL }}
          LIBRARY_SUPABASE_ANON_KEY: ${{ secrets.LIBRARY_SUPABASE_ANON_KEY }}
          ANKI_EMAIL: ${{ secrets.ANKI_EMAIL }}
          ANKI_PASSWORD: ${{ secrets.ANKI_PASSWORD }}
          ANKI_FIREBASE_PROJECT_ID: ${{ secrets.ANKI_FIREBASE_PROJECT_ID }}
          ANKI_FIREBASE_API_KEY: ${{ secrets.ANKI_FIREBASE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # A dry run checks once. Otherwise, keep checking until just before the six-hour job limit.
          LOOP_MINUTES: ${{ inputs.dry_run && '0' || '340' }}
      # Hand over to the next run. A dry run doesn't, and a failing run leaves the restart to the schedule.
      - name: Start the next run
        if: ${{ success() && !inputs.dry_run }}
        run: gh workflow run reminders.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
